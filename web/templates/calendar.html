<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plantamigo · Calendario</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='icono.png') }}">
    <style>
      {% include 'calendar.css' %}
      {% include 'common.css' %}
    </style>

</head>
<body>

  <header>
    <a href="/">
      <img class="logo" src="{{ url_for('static', filename='logo.png') }}" alt="Plantamigo">
    </a>

    <nav class="menu">
      <a href="/">Plant</a>
      <a href="#" onclick="return false">Chat</a>
      <a href="/" class="activo">Calendar</a>
      <a href="#" onclick="return false">Shop</a>
    </nav>

    <button class="usuario" title="Perfil">👤</button>
  </header>

  <main>
    <section class="calendario">
      <div class="cabecera-mes">
        <button class="flecha" id="mes-anterior">‹</button>
        <h1 id="nombre-mes"></h1>
        <button class="flecha" id="mes-siguiente">›</button>
      </div>

      <div class="dias-semana">
        <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
      </div>

      <div class="dias" id="dias"></div>
    </section>

    <section class="panel" id="panel">
      <h2 id="panel-fecha">Pick a day</h2>
      <div class="panel-icono" id="panel-icono">📅</div>
      <div class="panel-texto" id="panel-texto">
        Tap a day on the calendar to see how the plant was doing.
      </div>
    </section>
  </main>

  <script>
    // "const" para los valores fijos
    const MESES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    const hoy = new Date(); hoy.setHours(0, 0, 0, 0);

    // "let" para los que sean variables
    let mesSeleccionado = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
    let diaSeleccionado = null;

    // Convierten una fecha al formato AÑO-MES-DÍA
    function aTexto(fecha) {
      // El padStart añade un 0 al inicio: de 3 se pasa a 03
      const m = String(fecha.getMonth() + 1).padStart(2, "0");
      const d = String(fecha.getDate()).padStart(2, "0");
      return `${fecha.getFullYear()}-${m}-${d}`;
    }

    // Saca la fecha en texto legible
    function bonita(fecha) {          
      return fecha.toLocaleDateString("en-US", { weekday: "long", day: "numeric", month: "long" });
    }

    function dibujarCalendario() {
      // Pilla el div "dias" y lo limpia para dibujarlo de nuevo
      const contenedor = document.getElementById("dias");
      contenedor.innerHTML = "";

      // Selecciona el año y el mes y se lo introduce al h1 de antes
      const año = mesSeleccionado.getFullYear();
      const mes = mesSeleccionado.getMonth();
      document.getElementById("nombre-mes").textContent = `${MESES[mes]} ${año}`;

      // Gracias al getDay se sabe en qué día de la semana cae el día 1, p. ej.: domingo = 0, martes = 2...
      const diaSemanaDelUno = new Date(año, mes, 1).getDay();
      // Ajustar para que sea lunes = 0, martes = 1...
      const huecos = (diaSemanaDelUno + 6) % 7;

      // Por cada día (lunes, martes...) que haya antes del día 1 del mes, mete un span vacio
      for (let i = 0; i < huecos; i++) {
        contenedor.appendChild(document.createElement("span"));
      }

      // Al pedirle el día 0 del mes siguiente al actual, javascript lo corrige automaticamente con el día anterior a ese, o sea, la cantida de días que tiene el mes
      const diasDelMes = new Date(año, mes + 1, 0).getDate();
      const textoHoy = aTexto(hoy);
      
      // Guardar en textoSeleccionado el día que haya sido seleccionado
      let textoSeleccionado;
      if (diaSeleccionado) {
        textoSeleccionado = aTexto(diaSeleccionado);
      } else {
        textoSeleccionado = null;
      }

      // Va día por día poniendo los botones de cada uno de ellos
      for (let d = 1; d <= diasDelMes; d++) {
        const fecha = new Date(año, mes, d);
        const textoFecha = aTexto(fecha);
        const boton = document.createElement("button");

        boton.className = "dia";
        boton.textContent = d;

        if (textoFecha === textoHoy) boton.classList.add("hoy");
        if (textoFecha < textoHoy) boton.classList.add("pasado");
        if (textoFecha === textoSeleccionado) boton.classList.add("seleccionado");
        
        // Si se ha pulsado el botón. Lleva a la lectura de la BD
        boton.onclick = () => seleccionarDia(fecha);
        contenedor.appendChild(boton);
      }
    }

    // Al darle al boton para ir al mes anterior
    document.getElementById("mes-anterior").onclick = () => {
      mesSeleccionado = new Date(mesSeleccionado.getFullYear(), mesSeleccionado.getMonth() - 1, 1);
      dibujarCalendario();
    };
    
    // Al darle al boton para ir al mes siguiente
    document.getElementById("mes-siguiente").onclick = () => {
      mesSeleccionado = new Date(mesSeleccionado.getFullYear(), mesSeleccionado.getMonth() + 1, 1);
      dibujarCalendario();
    };

    // Muestra un icono y un texto en la caja de la derecha (la de los datos)
    function mostrar(icono, html) {
      document.getElementById("panel-icono").textContent = icono;
      document.getElementById("panel-texto").innerHTML = html;
    }

    function esc(texto) {
      const p = document.createElement("p");
      p.textContent = texto;
      return p.innerHTML;
    }

    function num(valor, unidad) {
      return valor === null ? "—" : `${valor}${unidad}`;
    }

    function pintarPlanta(p) {
      return `<div class="planta-dato">
        <h3>${esc(p.nombre)} <small>${esc(p.tipo)}</small></h3>
        <ul>
          <li>Temperature: <b>${num(p.temperatura_media, "°")}</b> (${num(p.temperatura_min, "°")} – ${num(p.temperatura_max, "°")})</li>
          <li>Humidity: <b>${num(p.humedad_media, " %")}</b></li>
          <li>Light: <b>${num(p.luz_media, " %")}</b></li>
          <li>Air: <b>${num(p.calidad_aire_media, " ppm")}</b></li>
        </ul>
        <small>${p.lecturas} readings</small>
      </div>`;
    }

    // En base al día que haya sido seleccionado, muestra los datos en la caja de la derecha
    async function seleccionarDia(fecha) {
      // Configurar la caja del calendario
      diaSeleccionado = fecha;
      dibujarCalendario();

      // Configurar la caja de la derecha
      document.getElementById("panel-fecha").textContent = bonita(fecha);
      mostrar("⏳", "Loading...");

      // Conectarse a la BD a traves de app.py mediante un fetch
      let respuesta;
      try {
        respuesta = await fetch(`/api/dia/${aTexto(fecha)}`);
      } catch {
        mostrar("📡", "Can't connect to the plant.");
        return;
      }

      // Si el servidor responde, pero la base de datos falla
      if (!respuesta.ok) {
        mostrar("⚠️", "There's a database error.");
        return;
      }

      // Convierte los datos para que no sean un JSON
      const datos = await respuesta.json().catch(() => null);

      // Conexión correcta, pero ese día no hay datos
      if (!datos.hay_datos) {
        mostrar("📭", "Nothing saved for this day.");
        return;
      }

      // Si todo va bien
      mostrar("📊", datos.plantas.map(pintarPlanta).join(""));
    }

    dibujarCalendario();
  </script>
</body>
</html>
