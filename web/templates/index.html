<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plantamigo</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='icono.png') }}">
  <style>
    {% include 'style.css' %}
    {% include 'common.css' %}
  </style>
</head>
<body>
    <header>
      <a href="/">
        <img class="logo" src="{{ url_for('static', filename='logo.png') }}" alt="Plantamigo">
      </a>

      <nav class="menu">
          <a href="/" class="activo">Plant</a>
          <a href="/chat">Chat</a>
          <a href="/calendar">Calendar</a>
          <a href="#" onclick="return false">Shop</a>
      </nav>

      <button class="usuario" title="Perfil">👤</button>
    </header>

  <h1>Current statistics</h1>

  <section class="tarjetas">
    <div class="tarjeta">
      <h2>Temperature</h2>
      <div class="icono" id="temp-icono">⏳</div>
      <div class="valor" id="temp-valor">--°</div>
      <div class="mensaje" id="temp-mensaje">Reading the sensor...</div>
      <div class="detalle" id="temp-detalle"></div>
    </div>
    <div class="tarjeta" id="luz-tarjeta">
      <h2>Light</h2>
      <div class="icono" id="luz-icono">⏳</div>
      <div class="valor" id="luz-valor">--%</div>
      <div class="mensaje" id="luz-mensaje">Reading the sensor...</div>
      <div class="detalle" id="luz-detalle"></div>
    </div>
    <div class="tarjeta">
      <h2>Humidity</h2>
      <div class="icono" id="hum-icono">⏳</div>
      <div class="valor" id="hum-valor">--%</div>
      <div class="mensaje" id="hum-mensaje">Reading the sensor...</div>
      <div class="detalle" id="hum-detalle"></div>
    </div>
  </section>

  <div class="acciones">
    <select id="cancion" title="Elige la canción"></select>
    <button id="boton-melodia" onclick="tocarMelodia()">🎵 Play song</button>
    <div id="estado-melodia"></div>
  </div>

  <div id="aviso" class="aviso" hidden>
    <span id="aviso-texto"></span>
    <button onclick="cerrarAviso()">✕</button>
  </div>

  <script>
    function estadoTemperatura(t) {
      if (t >= 30) return { icono: "🔥", mensaje: "It's very hot. You should water the plant." };
      if (t >= 25) return { icono: "☀️", mensaje: "It's hot, keep an eye on the plant so it doesn't dry out." };
      if (t >= 12) return { icono: "🪴", mensaje: "The temperature is just right, the plant is happy!" };
      return { icono: "❄️", mensaje: "It's cold, put the plant in a warmer spot." };
    }

    function estadoLuz(l) {
      //TODO: Esto deberá cambiar cuando introduzcamos los perfiles de planta
      if (l >= 40) return { icono: "🪴", mensaje: "The lighting is just right, the plant is happy!" };
      if (l >= 12) return { icono: "🌒", mensaje: "There's low light. You should move the plant." };
      return { icono: "🌑", mensaje: "There's no light, move the plant!" };
    }

    async function actualizarTemperatura() {
      try {
        const r = await fetch("/api/temperatura");
        const datos = await r.json();

        const e = estadoTemperatura(datos.temperatura);
        document.getElementById("temp-icono").textContent = e.icono;
        document.getElementById("temp-valor").textContent = datos.temperatura + "°";
        document.getElementById("temp-mensaje").textContent = e.mensaje;
        document.getElementById("temp-detalle").textContent =
          datos.antiguedad_s > 30 ? `Última lectura hace ${datos.antiguedad_s} s` : "";
      } catch (err) {
        document.getElementById("temp-mensaje").textContent = "Can't connect to the plant";
      }
    }

    async function actualizarLuz() {
      try {
        const r = await fetch("/api/luz");
        const datos = await r.json();

        // De noche no tiene sentido medir la luz: se desactiva la tarjeta
        const tarjeta = document.getElementById("luz-tarjeta");
        tarjeta.classList.toggle("desactivada", !datos.es_de_dia);
        if (!datos.es_de_dia) {
          document.getElementById("luz-icono").textContent = "🌙";
          document.getElementById("luz-valor").textContent = "--%";
          document.getElementById("luz-mensaje").textContent = "It's nighttime, the plant is resting.";
          document.getElementById("luz-detalle").textContent = "";
          return;
        }

        const e = estadoLuz(datos.luz);
        document.getElementById("luz-icono").textContent = e.icono;
        document.getElementById("luz-valor").textContent = datos.luz + "%";
        document.getElementById("luz-mensaje").textContent = e.mensaje;
        document.getElementById("luz-detalle").textContent =
          datos.antiguedad_s > 30 ? `Última lectura hace ${datos.antiguedad_s} s` : "";
      } catch (err) {
        document.getElementById("luz-mensaje").textContent = "Can't connect to the plant";
        
      }
    }
    let avisoSecoMostrado = false
    let prevHumVal = 100
    let temporizadorAviso

    // Aviso dentro de la página (no bloquea como alert); se cierra solo o con la ✕
    function mostrarAviso(texto, ms) {
      document.getElementById("aviso-texto").textContent = texto;
      document.getElementById("aviso").hidden = false;
      clearTimeout(temporizadorAviso);
      temporizadorAviso = setTimeout(cerrarAviso, ms);
    }
    function cerrarAviso() {
      document.getElementById("aviso").hidden = true;
    }

    // Umbrales orientativos: ajústalos al calibrar los sensores
    function estadoHumedad(h) {
      if (h-prevHumVal > 15) tocarMelodia()
      prevHumVal = h
      if (h >= 70) {
        avisoSecoMostrado = false
        return { icono: "💦", mensaje: "The soil is very damp; there’s no need to water it." };
      }
      if (h >= 35) {
        avisoSecoMostrado = false
        return { icono: "🪴", mensaje: "The humidity is just right; the plant is happy!" };
      }
      if(!avisoSecoMostrado){
      mostrarAviso("The soil is dry; the plant needs to be watered!", 2000000)
      avisoSecoMostrado = true
      }
      return { icono: "🏜️", mensaje: "The soil is dry; the plant needs to be watered!" };
    }

    async function actualizarHumedad() {
      try {
        const r = await fetch("/api/humedad");
        const datos = await r.json();

        if (datos.humedad === null) {
          document.getElementById("hum-mensaje").textContent = "Sin lectura de los sensores";
          return;
        }
        const e = estadoHumedad(datos.humedad);
        document.getElementById("hum-icono").textContent = e.icono;
        document.getElementById("hum-valor").textContent = datos.humedad + "%";
        document.getElementById("hum-mensaje").textContent = e.mensaje;
        document.getElementById("hum-detalle").textContent =
          datos.antiguedad_s > 30 ? `Última lectura hace ${datos.antiguedad_s} s` : "";
      } catch (err) {
        document.getElementById("hum-mensaje").textContent = "Can't connect to the plant";
      }
    }

    // "himno_alegria" -> "Himno Alegria" para mostrarlo bonito
    function nombreBonito(clave) {
      const texto = clave.replaceAll("_", " ");
      return texto[0].toUpperCase() + texto.slice(1);
    }

    // Rellena el selector con las canciones del repertorio
    async function cargarCanciones() {
      try {
        const r = await fetch("/api/canciones");
        const datos = await r.json();
        const select = document.getElementById("cancion");
        datos.canciones.forEach(clave => {
          const opcion = document.createElement("option");
          opcion.value = clave;
          opcion.textContent = nombreBonito(clave);
          select.appendChild(opcion);
        });
      } catch (err) {
        console.error("No se pudo cargar el repertorio");
      }
    }

    async function tocarMelodia() {
      const boton = document.getElementById("boton-melodia");
      const estado = document.getElementById("estado-melodia");
      boton.disabled = true;
      estado.textContent = "Sonando...";
      try {
        const cancion = document.getElementById("cancion").value;
        const r = await fetch("/api/melodia", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ cancion })
        });
        estado.textContent = (await r.json()).mensaje;
      } catch (err) {
        estado.textContent = "Can't connect to the plant";
      }
      boton.disabled = false;
    }

    cargarCanciones();
    actualizarTemperatura();
    actualizarLuz();
    actualizarHumedad();
    setInterval(actualizarHumedad, 5000);
    setInterval(actualizarTemperatura, 5000);
    setInterval(actualizarLuz, 5000);  
  </script>
</body>
</html>
